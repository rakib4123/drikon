name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9.12.0"
  # Test env (matches docker-compose defaults)
  DATABASE_URL: "postgresql://drikon:drikon_dev_password@localhost:5432/drikon_test?schema=public"
  JWT_ACCESS_SECRET: "ci_access_secret_at_least_32_chars_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
  JWT_REFRESH_SECRET: "ci_refresh_secret_at_least_32_chars_yyyyyyyyyyyyyyyyyyyyyyyyyyyyyyy"
  WEB_ORIGIN: "http://localhost:3000"
  NEXT_PUBLIC_API_URL: "http://localhost:4000"

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @drikon/api db:generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: drikon
          POSTGRES_PASSWORD: drikon_dev_password
          POSTGRES_DB: drikon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U drikon"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @drikon/api db:generate

      - name: Migrate DB
        run: pnpm --filter @drikon/api exec prisma migrate deploy

      - name: Test
        run: pnpm test

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @drikon/api db:generate

      - name: Build
        run: pnpm build
